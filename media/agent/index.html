<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ваш ИИ-агент</title>
<!-- The chat panel of the agent's video: a plain page, belonging to no company on
     purpose. What it shows is not written here: scenes.mjs runs a real agent over
     MCP against a planner in a sandbox and hands over its calls and words as they
     happen, through agentEvent(). The planner stands next to it in the frame. -->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #f3f5f7;
    color: #1c232b;
    font: 17px/1.42 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    font-weight: 600;
  }
  .mark { width: 22px; height: 22px; border-radius: 50%; background: #3f4b57; }
  .link {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    color: #66717d;
    font-size: 13px;
    font-weight: 400;
  }
  .link i { width: 8px; height: 8px; border-radius: 50%; background: #2e9e6b; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 0 16px 16px;
  }
  .greeting {
    margin: auto 0 20px;
    text-align: center;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .talk {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 6px 4px 12px;
  }
  .talk[hidden], .greeting[hidden] { display: none; }
  .talk > * { flex: none; }
  .mine {
    align-self: flex-end;
    max-width: 92%;
    padding: 10px 14px;
    border-radius: 16px;
    background: #e2e7ec;
    font-size: 16px;
  }
  .say { padding: 2px 2px; }
  .thinking { display: flex; gap: 6px; padding: 8px 2px; }
  .thinking i {
    width: 8px; height: 8px; border-radius: 50%; background: #8a95a1;
    animation: beat 1s infinite ease-in-out;
  }
  .thinking i:nth-child(2) { animation-delay: 0.15s; }
  .thinking i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes beat { 50% { transform: translateY(-4px); opacity: 0.5; } }
  .call {
    display: grid;
    grid-template-columns: 18px 1fr;
    column-gap: 9px;
    padding: 7px 11px;
    border: 1px solid #dde2e7;
    border-radius: 10px;
    background: #ffffff;
    font-size: 14px;
    line-height: 1.3;
  }
  .call code { font: 600 13.5px Consolas, monospace; color: #33404c; }
  .call .detail { grid-column: 2; color: #66717d; }
  .call .state { width: 14px; height: 14px; margin-top: 2px; border-radius: 50%; border: 2px solid #c3cbd3; border-top-color: #3f4b57; animation: spin .7s linear infinite; }
  .call.ok .state, .call.failed .state { border: none; animation: none; color: #2e9e6b; font-size: 15px; line-height: 15px; margin: 0; }
  .call.ok .state::before { content: "✓"; }
  .call.failed .state { color: #c0392b; }
  .call.failed .state::before { content: "✕"; }
  /* What changes the calendar stands out from what only reads it. */
  .call.writes { border-color: #bcd3e6; background: #f5fafe; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 10px 10px 16px;
    border: 1px solid #d3d9df;
    border-radius: 18px;
    background: #ffffff;
  }
  .composer.start { margin-bottom: auto; }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: none;
    color: inherit;
    font: 16px/1.42 "Segoe UI", system-ui, sans-serif;
    height: 190px;
  }
  button {
    flex: none;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 11px;
    background: #2f3a45;
    color: #ffffff;
    font-size: 19px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header><span class="mark"></span>Ваш ИИ-агент<span class="link"><i></i>Космос календарь, MCP</span></header>
  <main>
    <h1 class="greeting" id="greeting">Чем помочь?</h1>
    <section class="talk" id="talk" hidden></section>
    <form class="composer start" id="composer">
      <textarea id="text" placeholder="Напишите, что нужно сделать"></textarea>
      <button id="send" title="Отправить" type="submit">↑</button>
    </form>
  </main>
<script>
  const composer = document.getElementById('composer');
  const text = document.getElementById('text');
  const talk = document.getElementById('talk');
  const calls = new Map();
  let dots = null;

  const element = (tag, className, content) => {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (content) e.textContent = content;
    return e;
  };

  const down = () => talk.scrollTo({ top: talk.scrollHeight, behavior: 'smooth' });

  /** The dots stand last while the agent has nothing to show. */
  const thinking = (on) => {
    if (on && !dots) {
      dots = element('div', 'thinking');
      dots.append(element('i'), element('i'), element('i'));
    }
    if (on) talk.append(dots);
    else if (dots) dots.remove();
    down();
  };

  composer.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!text.value.trim()) return;
    document.getElementById('greeting').hidden = true;
    talk.hidden = false;
    composer.classList.remove('start');
    text.style.height = '24px';
    talk.append(element('div', 'mine', text.value));
    text.value = '';
    thinking(true);
  });

  const when = (value) => {
    const [y, m, d] = value.slice(0, 10).split('-').map(Number);
    const day = new Date(y, m - 1, d).toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
    return value.length > 10 ? `${day}, ${value.slice(11, 16)}` : day;
  };

  /** A person's words for a call: what it asked about, from its real arguments and result. */
  function detail(tool, args, title) {
    const name = title || args.title || '';
    switch (tool) {
      case 'agenda': return args.from ? `${when(args.from)} – ${when(args.to)}` : '';
      case 'list_tasks': return 'открытые задачи';
      case 'search': return args.query || '';
      case 'create_event':
      case 'update_event': return [name, args.start && when(args.start)].filter(Boolean).join(' · ');
      case 'create_task':
      case 'update_task': return [name, args.due && when(args.due)].filter(Boolean).join(' · ');
      case 'set_task_state': return [name, args.state === 'done' && 'выполнена'].filter(Boolean).join(' · ');
      default: return name;
    }
  }

  /** A line from the scene: a JSON of what the agent has just done. */
  window.agentEvent = async (line) => {
    const event = JSON.parse(line);
    if (event.type === 'call') {
      const row = element('div', `call${/^(create|update|set|delete|mark)_/.test(event.tool) ? ' writes' : ''}`);
      const info = element('div', 'detail', detail(event.tool, event.args));
      row.append(element('span', 'state'), element('code', '', event.tool), info);
      if (!info.textContent) info.remove();
      calls.set(event.id, { row, info, event });
      thinking(false);
      talk.append(row);
      thinking(true);
    } else if (event.type === 'done') {
      const { row, info, event: call } = calls.get(event.id);
      row.classList.add(event.ok ? 'ok' : 'failed');
      if (event.title) {
        info.textContent = detail(call.tool, call.args, event.title);
        if (!info.parentNode) row.append(info);
      }
    } else if (event.type === 'say') {
      thinking(false);
      const paragraph = element('div', 'say');
      talk.append(paragraph);
      // By words, the way such pages show an answer.
      for (const word of event.text.split(' ')) {
        paragraph.append(`${word} `);
        down();
        await new Promise((resolve) => setTimeout(resolve, 45));
      }
      if (!event.last) thinking(true);
    }
  };
</script>
</body>
</html>
