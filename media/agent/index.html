<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ваш ИИ-агент</title>
<!-- The stage of the "ask your agent" video: a plain chat page, belonging to no
     company on purpose. Its words come from a real agent: scenes.mjs asks Codex
     first, then types the request here and hands over the answer. -->
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: #f3f5f7;
    color: #1c232b;
    font: 18px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 28px;
    font-weight: 600;
  }
  .mark { width: 26px; height: 26px; border-radius: 50%; background: #3f4b57; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: min(820px, 100%);
    margin: 0 auto;
    padding: 0 24px 28px;
    min-height: 0;
  }
  .greeting {
    margin: auto 0 26px;
    text-align: center;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .talk { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding-top: 18px; }
  .talk[hidden], .greeting[hidden] { display: none; }
  .mine {
    align-self: flex-end;
    max-width: 82%;
    padding: 14px 18px;
    border-radius: 18px;
    background: #e2e7ec;
  }
  .theirs { max-width: 90%; }
  .thinking { display: flex; gap: 6px; padding: 8px 0; }
  .thinking i {
    width: 9px; height: 9px; border-radius: 50%; background: #8a95a1;
    animation: beat 1s infinite ease-in-out;
  }
  .thinking i:nth-child(2) { animation-delay: 0.15s; }
  .thinking i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes beat { 50% { transform: translateY(-5px); opacity: 0.5; } }
  .file {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    padding: 12px 16px;
    border: 1px solid #d3d9df;
    border-radius: 12px;
    background: #ffffff;
    font-size: 16px;
  }
  .file b { display: block; font-weight: 600; }
  .file span { color: #66717d; font-size: 14px; }
  .file svg { flex: none; }
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 14px 14px 14px 20px;
    border: 1px solid #d3d9df;
    border-radius: 20px;
    background: #ffffff;
  }
  .composer.start { margin-bottom: auto; }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: none;
    color: inherit;
    font: inherit;
    height: 112px;
  }
  button {
    flex: none;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: #2f3a45;
    color: #ffffff;
    font-size: 21px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header><span class="mark"></span>Ваш ИИ-агент</header>
  <main>
    <h1 class="greeting" id="greeting">Чем помочь?</h1>
    <section class="talk" id="talk" hidden></section>
    <form class="composer start" id="composer">
      <textarea id="text" placeholder="Напишите, что нужно сделать"></textarea>
      <button id="send" title="Отправить" type="submit">↑</button>
    </form>
  </main>
<script>
  const composer = document.getElementById('composer');
  const text = document.getElementById('text');
  const talk = document.getElementById('talk');
  let answer = null;

  const element = (tag, className, content) => {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (content) e.textContent = content;
    return e;
  };

  composer.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!text.value.trim()) return;
    document.getElementById('greeting').hidden = true;
    talk.hidden = false;
    composer.classList.remove('start');
    text.style.height = '30px';
    talk.append(element('div', 'mine', text.value));
    text.value = '';
    answer = element('div', 'theirs');
    const dots = element('div', 'thinking');
    dots.append(element('i'), element('i'), element('i'));
    answer.append(dots);
    talk.append(answer);
  });

  /** The answer of the agent comes by words, the way such pages show it; then its file. */
  window.reply = async (message, fileName) => {
    answer.replaceChildren();
    const paragraph = element('div');
    answer.append(paragraph);
    for (const word of message.split(' ')) {
      paragraph.append(`${word} `);
      await new Promise((resolve) => setTimeout(resolve, 55));
    }
    const file = element('div', 'file');
    file.insertAdjacentHTML('afterbegin', '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3f4b57" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>');
    const name = element('div');
    name.append(element('b', '', fileName), element('span', '', 'Файл календаря'));
    file.append(name);
    answer.append(file);
  };
</script>
</body>
</html>
